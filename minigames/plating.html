<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plating pass</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<script src="specs.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
/* Plating pass · PLATE
   Drag components from the rack onto the plate, in recipe order (base → main → sauce → garnish).
   The ghost guide shows where each piece goes. Hold Shift while dragging for tweezers (slow, precise),
   needed for small garnish. Ring the bell (Space) to serve. */
const PL={x:510,y:285,r:170},RACK={x:745,y:72,w:125,h:52},BELL={x:745,y:452,w:125,h:50};
const LAYER=['base','main','sauce','garnish'];
const VARS=[
 {id:'omelette',name:'Quantum Omelette',kind:'3 layers',desc:'A soft classic: glaze, omelette, chives.',icon:'🍳',comps:[
   {n:'Plasma butter glaze',L:0,col:'#FFC533',shape:'smear',s:95,pts:[[0,0]]},{n:'Phase-shifted omelette',L:1,col:'#FFE9A8',shape:'half',s:70,pts:[[0,-6]]},{n:'Cryo-chives',L:3,col:'#4CAF50',shape:'leaf',s:12,pts:[[-30,-40],[0,-48],[30,-40]]}]},
 {id:'noodles',name:'Neon Noodle Nest',kind:'3 layers',desc:'A nest in a pool of broth, shrooms on top.',icon:'🍜',comps:[
   {n:'Ion broth',L:0,col:'#F2852C',shape:'pool',s:110,pts:[[0,0]]},{n:'Plasma noodles',L:1,col:'#FFD86B',shape:'nest',s:62,pts:[[0,0]]},{n:'Glow-shroom',L:3,col:'#6FE0FF',shape:'ball',s:13,pts:[[-26,-18],[24,-22],[2,26]]}]},
 {id:'meatballs',name:'Mitosis Meatballs',kind:'4 layers',desc:'Swoosh, three meatballs, sauce dots, spice.',icon:'🍝',comps:[
   {n:'Tomato plasma swoosh',L:0,col:'#E8473B',shape:'swoosh',s:120,pts:[[0,10]]},{n:'Synth-mince ball',L:1,col:'#B5523B',shape:'ball',s:26,pts:[[-55,0],[0,-12],[55,0]]},
   {n:'Comet sauce dot',L:2,col:'#D6336C',shape:'dot',s:9,pts:[[-80,50],[-40,60],[40,60],[80,50]]},{n:'Splitting spice',L:3,col:'#9D88FF',shape:'gem',s:8,pts:[[-28,-40],[28,-44]]}]},
 {id:'brulee',name:'Cryo-Crème Brûlée',kind:'3 layers · precise',desc:'Tiny berries on exact dots.',icon:'🍮',comps:[
   {n:'Vanilla custard',L:0,col:'#FFE9A8',shape:'pool',s:85,pts:[[0,0]]},{n:'Caramel crust',L:1,col:'#C98F00',shape:'disc',s:70,pts:[[0,0]]},{n:'Nitro berry',L:3,col:'#D6336C',shape:'ball',s:9,pts:[[-20,-10],[0,-24],[20,-10],[0,6]]}]},
];
let S=null;
const rot=(p,a)=>[p[0]*Math.cos(a)-p[1]*Math.sin(a),p[0]*Math.sin(a)+p[1]*Math.cos(a)];
MG.create({
  id:'plating',name:'Plating pass',verb:'PLATE',plateLabel:'PLATING PASS · HOLO GUIDE',
  menuTitle:'Pick a dish to plate',
  intro:'Drag each component from the rack onto the plate in recipe order: base, then main, sauce, garnish. The ghost guide shows where each piece goes. Hold Shift while dragging for tweezers (slow and precise). Ring the bell to serve.',
  keys:'<kbd>Drag</kbd> place · <kbd>Shift</kbd> tweezers · <kbd>Space</kbd> ring the bell',
  variants:VARS,
  order(v,rand,K){const a=(rand()-.5)*1.4,ox=(rand()-.5)*30,oy=(rand()-.5)*30;
    const comps=v.comps.map(c=>({...c,pts:c.pts.map(p=>{const q=rot(p,a);return[q[0]+ox,q[1]+oy]})}));const n=comps.reduce((s,c)=>s+c.pts.length,0);
    return{units:n,comps,rot:a,title:v.name,subtitle:comps.map(c=>`${LAYER[c.L]}: ${c.n}`).join(' → '),chip:`${n} pieces`,label:'Plate'}},
  start(K,o){S={o,comps:o.comps.map((c,i)=>({...c,i,left:c.pts.length})),placed:[],drag:null,seq:0,served:false}},
  down(K,x,y,e){const ci=rackHit(x,y);if(ci!=null){const c=S.comps[ci];if(!c.left){K.toast('All placed');return}S.drag={c,x,y,mx:x,my:y};K.sfx.click();return}
    if(x>BELL.x&&x<BELL.x+BELL.w&&y>BELL.y&&y<BELL.y+BELL.h)serve(K)},
  move(K,x,y,e){const d=S.drag;if(!d)return;const f=e.shiftKey?K.T.tweez:1;d.x+=(x-d.mx)*f;d.y+=(y-d.my)*f;d.mx=x;d.my=y;d.tw=e.shiftKey},
  up(K){const d=S.drag;if(!d)return;S.drag=null;if(Math.hypot(d.x-PL.x,d.y-PL.y)>PL.r+10){K.sfx.tink();return}
    S.placed.push({c:d.c,x:d.x-PL.x,y:d.y-PL.y,seq:S.seq++});d.c.left--;K.sfx.pop();K.burst(d.x,d.y,{n:8,col:d.c.col,spd:80,life:.35,r:2})},
  key(K,k,down){if(down&&k===' '){serve(K);return true}},
  draw(K,g,now){if(!S)return;const{draw:D,C}=K;
    // plate
    g.save();g.shadowColor=C.cyan;g.shadowBlur=24;g.fillStyle='#EEF6F8';g.beginPath();g.arc(PL.x,PL.y,PL.r+18,0,K.TAU);g.fill();g.restore();
    g.fillStyle='#dfe9ec';g.beginPath();g.arc(PL.x,PL.y,PL.r,0,K.TAU);g.fill();g.strokeStyle='rgba(120,150,160,.4)';g.lineWidth=2;g.beginPath();g.arc(PL.x,PL.y,PL.r,0,K.TAU);g.stroke();
    // guide ghosts
    if(K.T.guide){g.save();g.globalAlpha=.35+.1*Math.sin(now/300);g.setLineDash([4,4]);for(const c of S.comps)for(const p of c.pts){shape(g,c,PL.x+p[0],PL.y+p[1],true)}g.restore()}
    // placed in sequence
    for(const p of S.placed)shape(g,p.c,PL.x+p.x,PL.y+p.y,false);
    // rack
    D.text(g,'RACK · drag to the plate',RACK.x,RACK.y-12,{align:'left',font:'600 10px "IBM Plex Mono", monospace',col:C.cyan2});
    S.comps.forEach((c,i)=>{const y=RACK.y+i*(RACK.h+8);D.box(g,RACK.x,y,RACK.w,RACK.h,10,{fill:c.left?'rgba(6,18,22,.88)':'rgba(6,18,22,.4)',stroke:c.left?c.col:'rgba(127,243,255,.15)',glow:c.left?c.col:null,blur:6});
      g.save();g.globalAlpha=c.left?1:.3;shape(g,c,RACK.x+22,y+RACK.h/2,false,Math.min(1,18/c.s));g.restore();
      D.text(g,LAYER[c.L].toUpperCase(),RACK.x+44,y+14,{align:'left',font:'600 9px "IBM Plex Mono", monospace',col:C.dim});
      g.save();g.beginPath();g.rect(RACK.x+44,y+20,RACK.w-48,18);g.clip();D.text(g,c.n,RACK.x+44,y+29,{align:'left',font:'600 11px "IBM Plex Sans", sans-serif',col:c.left?C.ink:C.dim});g.restore();
      D.text(g,'×'+c.left,RACK.x+RACK.w-8,y+44,{align:'right',font:'700 11px "IBM Plex Mono", monospace',col:c.left?C.cyan2:C.dim})});
    D.box(g,BELL.x,BELL.y,BELL.w,BELL.h,12,{fill:'rgba(255,110,74,.2)',stroke:C.accent,glow:C.accent});D.text(g,'🔔 SERVE',BELL.x+BELL.w/2,BELL.y+19,{font:'700 14px "IBM Plex Mono", monospace',col:'#FFD9CC'});D.text(g,'space',BELL.x+BELL.w/2,BELL.y+37,{font:'500 10px "IBM Plex Mono", monospace',col:C.dim});
    // dragged piece
    if(S.drag){const d=S.drag;g.save();g.shadowColor=d.c.col;g.shadowBlur=16;shape(g,d.c,d.x,d.y,false);g.restore();if(d.tw){D.ring(g,d.x,d.y,d.c.s+10,0,K.TAU,'rgba(255,255,255,.7)',1.5);D.text(g,'tweezers',d.x,d.y-d.c.s-20,{font:'600 10px "IBM Plex Mono", monospace',col:'#fff'})}}
    K.hint(K.playing?'drag = place · hold Shift = tweezers · space = serve':'')},
  panel(K){if(!S)return{};const exp=S.comps.map(c=>c.L).sort((a,b)=>a-b),next=S.comps.filter(c=>c.left).sort((a,b)=>a.L-b.L)[0];
    return{big:`${S.placed.length}/${S.o.units} <small>placed</small>`,sub:S.comps.slice().sort((a,b)=>a.L-b.L).map(c=>`<div style="color:${c.left?'#E2F6FF':'#3CC48E'}">${c.left?'○':'●'} ${LAYER[c.L]} · ${c.n}</div>`).join(''),slots:S.placed.map(p=>acc(K,p)>.7?'ok':'warn')}},
  evaluate(K){const ps=S.placed;let inv=0,pairs=0;for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){if(ps[i].c.L===ps[j].c.L)continue;pairs++;if(ps[i].c.L>ps[j].c.L)inv++}
    const ord=pairs?1-inv/pairs:ps.length?1:0,pl=S.comps.map(c=>{const mine=ps.filter(p=>p.c===c),used=new Set();let s=0;for(const p of mine){let b=null,bd=1e9;c.pts.forEach((q,k)=>{if(used.has(k))return;const d=Math.hypot(p.x-q[0],p.y-q[1]);if(d<bd){bd=d;b=k}});if(b!=null){used.add(b);s+=accD(K,c,bd)}}return s/c.pts.length});
    const place=pl.reduce((a,b)=>a+b,0)/pl.length,missing=S.comps.reduce((a,c)=>a+c.left,0);
    return{score:100*(ord*.35+place*.65)*(ps.length?1:0),lines:[['Layer order',`${Math.round(ord*100)}%${inv?` (${inv} out of order)`:''}`],['Placement accuracy',Math.round(place*100)+'%'],['Missing pieces',missing]],
      bars:{items:S.comps.map((c,i)=>({v:Math.round(pl[i]*100),label:LAYER[c.L],cls:pl[i]>.75?'ok':pl[i]>.4?'warn':'bad'})),max:100},note:'35% layer order, 65% placement (distance to the guide; small garnish is judged tighter).'}},
});
function accD(K,c,d){const tol=(c.s<15?10:c.s<40?22:35)*K.T.tol;return Math.max(0,1-Math.max(0,d-tol*.3)/tol)}
function acc(K,p){let bd=1e9;for(const q of p.c.pts)bd=Math.min(bd,Math.hypot(p.x-q[0],p.y-q[1]));return accD(K,p.c,bd)}
function rackHit(x,y){if(x<RACK.x||x>RACK.x+RACK.w)return null;const i=Math.floor((y-RACK.y)/(RACK.h+8));if(i<0||i>=S.comps.length||y-RACK.y-i*(RACK.h+8)>RACK.h)return null;return i}
function serve(K){if(!K.playing)return;K.state='ending';K.sfx.tone(1568,.6,.25,'sine');K.sfx.tone(2093,.5,.12,'sine',null,.02);setTimeout(()=>K.finish('done'),600)}
function shape(g,c,x,y,ghost,sc=1){const s=c.s*sc;g.save();g.translate(x,y);g.fillStyle=ghost?'transparent':c.col;g.strokeStyle=ghost?'#0BA5C4':'rgba(0,0,0,.15)';g.lineWidth=ghost?1.5:1;
  const fs=()=>{if(!ghost)g.fill();g.stroke()};g.beginPath();
  switch(c.shape){
    case'pool':g.arc(0,0,s,0,Math.PI*2);if(!ghost){g.globalAlpha=.85}fs();break;
    case'smear':g.ellipse(0,0,s,s*.45,-.3,0,Math.PI*2);fs();break;
    case'half':g.arc(0,0,s,Math.PI*.05,Math.PI*.95+Math.PI);g.closePath();fs();break;
    case'nest':g.arc(0,0,s,0,Math.PI*2);fs();if(!ghost){g.strokeStyle='rgba(160,110,20,.6)';g.lineWidth=2;for(let i=0;i<10;i++){g.beginPath();g.arc(Math.cos(i)*s*.3,Math.sin(i*1.7)*s*.3,s*.5,i,i+2.4);g.stroke()}}break;
    case'swoosh':g.lineWidth=ghost?1.5:Math.max(5,22*sc);g.lineCap='round';g.arc(0,-s*.6,s,Math.PI*.25,Math.PI*.75);if(ghost)g.stroke();else{g.strokeStyle=c.col;g.stroke()}break;
    case'leaf':g.ellipse(0,0,s,s*.35,.6,0,Math.PI*2);fs();break;
    case'gem':g.moveTo(0,-s);g.lineTo(s*.7,0);g.lineTo(0,s);g.lineTo(-s*.7,0);g.closePath();fs();break;
    default:g.arc(0,0,s,0,Math.PI*2);fs();if(!ghost&&s>10){g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.arc(-s*.3,-s*.3,s*.3,0,Math.PI*2);g.fill()}}
  g.restore()}
</script>
</body>
</html>
